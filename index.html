<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Uniformes Farmatodo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --brand:#0098DB; --brand-ink:#0077B0; --navy:#002060; --navy-2:#0A2B75;
  --bg:#F2F6FB; --surface:#FFFFFF; --surface-2:#F7FAFD; --ink:#0D1A33; --muted:#56657F; --line:#DAE2EE;
  --ok:#3F8A0E; --ok-bg:#EAF6DC; --warn:#C85400; --warn-bg:#FFEEDD; --crit:#C22E73; --crit-bg:#FBE4EF;
  --info-bg:#E2F3FB; --shadow:0 1px 2px rgba(0,32,96,.06),0 6px 20px rgba(0,32,96,.06);
  --r:10px; --f-disp:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif; --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --brand:#2BB3F0; --brand-ink:#5CC6F5; --navy:#001540; --navy-2:#0B2660;
  --bg:#07112A; --surface:#0E1B3A; --surface-2:#12234A; --ink:#E7EEF8; --muted:#9AA9C4; --line:#223660;
  --ok:#8DD14A; --ok-bg:#1C3313; --warn:#FF9A4D; --warn-bg:#3A230E; --crit:#F27AB3; --crit-bg:#3D1530; --info-bg:#0F2E4A; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --brand:#2BB3F0; --brand-ink:#5CC6F5; --navy:#001540; --navy-2:#0B2660;
  --bg:#07112A; --surface:#0E1B3A; --surface-2:#12234A; --ink:#E7EEF8; --muted:#9AA9C4; --line:#223660;
  --ok:#8DD14A; --ok-bg:#1C3313; --warn:#FF9A4D; --warn-bg:#3A230E; --crit:#F27AB3; --crit-bg:#3D1530; --info-bg:#0F2E4A; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
/* header */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1320px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{height:30px;width:auto;display:block}
@media (max-width:600px){.logo{height:24px}}
.sync{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.sync.ok{background:rgba(120,190,32,.25)}.sync.busy{background:rgba(0,152,219,.35)}.sync.err{background:#C22E73}.sync.warn{background:#FF6C0C;color:#2a1300}
.tag{font-family:var(--f-disp);font-weight:800;font-size:13px;background:#0098DB;color:#fff;border-radius:999px;padding:3px 10px}
.brandrow .sp{flex:1}
.meta-chip{font-size:12px;color:#C9D6EE;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.12);color:#fff}
.role.admin{background:#78BE20;color:#0B2200}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:#C9D6EE;text-decoration:none;padding:9px 14px 11px;font-weight:700;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
nav.tabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs a.on{color:#fff;border-bottom-color:#0098DB}
nav.tabs .cnt{display:inline-block;min-width:20px;font-size:11px;padding:0 6px;border-radius:999px;background:#C22E73;color:#fff;margin-left:6px;text-align:center}
main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.2px}
h1{font-size:24px;font-weight:900}
h2{font-size:18px;font-weight:800}
h3{font-size:15px;font-weight:800}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:14px 16px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--info-bg);border:1px solid var(--line);font-size:13px}
.banner.warn{background:var(--warn-bg)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:border-color .15s}
.kpi:hover{border-color:var(--brand)}
.kpi:focus-visible{outline:2px solid var(--brand)}
.kpi .v{font-family:var(--f-disp);font-weight:900;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)}
/* family grid */
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fam{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.fam:hover{border-color:var(--brand)}
.fam:focus-visible{outline:2px solid var(--brand)}
.fam-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fam-t h3{font-size:16px}
.health{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}
.health i{display:block;height:100%}
.h-ok{background:#78BE20}.h-low{background:#FF6C0C}.h-zero{background:#D6428A}
.fam-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.fam-stats b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--f-disp);font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--brand-ink);border-color:transparent}
.chip.navy{background:var(--navy);color:#fff;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1000px){.two,.three{grid-template-columns:1fr}}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.desc{min-width:240px}
tfoot td{font-weight:800;background:var(--surface-2)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.okb i{background:#78BE20}
/* controls */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
textarea.inp{min-height:80px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;min-height:36px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink);color:#fff}
.btn.navy{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 10px;min-height:28px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px}
.seg button.on{background:var(--navy-2);color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
label.f .inp{font-weight:400;color:var(--ink)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* family view */
.fam-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.fam-layout{grid-template-columns:1fr}}
.fam-list{display:flex;flex-direction:column;gap:2px;padding:8px}
@media (max-width:900px){.fam-list{flex-direction:row;overflow-x:auto}}
.fam-list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;font-weight:700;white-space:nowrap}
.fam-list button:hover{background:var(--surface-2)}
.fam-list button.on{background:var(--navy-2);color:#fff}
.fam-list button:focus-visible{outline:2px solid var(--brand)}
.matrix td,.matrix th{text-align:center;padding:6px}
.matrix td.m{text-align:left;font-weight:700;min-width:220px}
.cell{all:unset;cursor:pointer;display:block;min-width:46px;padding:5px 4px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:700;text-align:center}
.cell.ok{background:var(--ok-bg);color:var(--ok)}
.cell.low{background:var(--warn-bg);color:var(--warn)}
.cell.zero{background:var(--crit-bg);color:var(--crit)}
.cell small{display:block;font-weight:600;font-size:10px;opacity:.85}
.cell:focus-visible{outline:2px solid var(--brand)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* gantt */
.gantt{min-width:760px;position:relative}
.g-axis{display:grid;grid-template-columns:260px 1fr;border-bottom:1px solid var(--line)}
.g-months{position:relative;height:30px}
.g-months span{position:absolute;top:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-left:6px;border-left:1px solid var(--line);height:22px}
.g-row{display:grid;grid-template-columns:260px 1fr;border-bottom:1px solid var(--line);cursor:pointer}
.g-row:hover{background:var(--surface-2)}
.g-lab{padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.g-lab b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;height:52px}
.g-bar{position:absolute;top:20px;height:12px;border-radius:99px;background:var(--info-bg);border:1px solid var(--brand);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--brand)}
.g-bar.late{border-color:var(--crit)} .g-bar.late i{background:var(--crit)}
.g-bar.done{border-color:#78BE20}.g-bar.done i{background:#78BE20}
.g-dot{position:absolute;top:16px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);border:2px solid var(--brand);background:var(--surface)}
.g-dot.rec{background:#78BE20;border-color:#78BE20}
.g-dot.late{border-color:var(--crit);background:var(--crit-bg)}
.g-dot.part{background:linear-gradient(135deg,#78BE20 50%,var(--surface) 50%);border-color:#78BE20}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:#FF6C0C;z-index:2;pointer-events:none}
.g-track .g-today::after{display:none}
.g-today::after{content:"Hoy";position:absolute;top:2px;left:4px;font-size:10px;font-weight:800;color:var(--warn)}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,16,48,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,16,48,.25)}
.dr-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dr-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--f-disp);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;background:var(--surface);cursor:pointer}
.drop.hover{border-color:var(--brand);background:var(--info-bg)}
.drop b{font-family:var(--f-disp);font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-disp);font-size:16px;margin-bottom:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.date-b{flex:none;width:46px;text-align:center;border-radius:8px;background:var(--info-bg);padding:4px 0;font-family:var(--f-disp);line-height:1.1}
.date-b b{display:block;font-size:18px;font-weight:900;color:var(--brand-ink)}
.date-b span{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--brand-ink)}
.date-b.late{background:var(--crit-bg)} .date-b.late b,.date-b.late span{color:var(--crit)}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 50px;gap:10px;align-items:center;padding:6px 16px;font-size:13px}
.hbar .t{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--navy-2)}
:root[data-theme="dark"] .hbar .t i{background:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hbar .t i{background:var(--brand)}}
.lines-ed{display:flex;flex-direction:column;gap:6px}
.line-row{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;align-items:center}
.ent-row{display:grid;grid-template-columns:140px 90px 90px 140px 1fr 36px;gap:6px;align-items:center}
@media (max-width:700px){.ent-row{grid-template-columns:1fr 1fr}.line-row{grid-template-columns:1fr 80px 36px}}
.ent-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:700px){.ent-head{display:none}}
.foot{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crit-bg);color:var(--crit);padding:8px 12px;border-radius:8px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">

const FAMILIAS=[
  [/^PANTALONES?\s+JEANS/,"Jeans"],[/^PANTALON/,"Pantalones"],[/^CHEMISE/,"Chemises"],[/^CAMISETA\s+POLO/,"Camisetas polo"],
  [/^CAMISA/,"Camisas"],[/^BLUSA/,"Blusas"],[/^BATA/,"Batas"],[/^CHALECO/,"Chalecos"],[/^SUETER|^SUÉTER/,"Suéteres"],
  [/^CHAQUETA|^BLAZER/,"Chaquetas y blazers"],[/^FRANELA/,"Franelas"],[/^BOTA/,"Calzado de seguridad"],[/^CONJUNTO/,"Conjuntos dermo"]];
const famOf=d=>{for(const [re,f] of FAMILIAS)if(re.test(d))return f;return "Otros"};
const SIZE_ORD=["XS","S","M","L","XL","XXL","XXXL","XXXXL","XXXXXL"];
function splitTalla(d){
  let m=d.match(/\bTALLA\s+([A-Z0-9]+)\b/);
  if(m){return {talla:m[1],modelo:d.replace(m[0]," ").replace(/\s+/g," ").trim()}}
  m=d.match(/\s(XS|S|M|L|XL|XXL|XXXL|XXXXL)$/);
  if(m)return {talla:m[1],modelo:d.slice(0,m.index).trim()};
  return {talla:"Única",modelo:d};
}
const sizeKey=t=>{const i=SIZE_ORD.indexOf(t);if(i>=0)return i;const n=parseFloat(t);return isNaN(n)?999:100+n};
const ESTADOS=["Solicitado","Aprobado","En producción","En tránsito","Recibido","Cancelado"];

  canEdit:false,isAdmin:false,asReader:false,email:"",rev:"",ready:{stock:false,ped:false},local:false,

  preview:null,drawer:null};

/* ---------- cálculo ---------- */
function derive(){
  const items=(S.stock||[]).map(r=>{const d=r.d||"";const st=splitTalla(d);const w=r.w||[0,0,0,0,0];
    const weekly=(num(w[1])+num(w[2])+num(w[3])+num(w[4]))/4;
    return {sku:String(r.s),desc:d,prov:r.p||"",sub:r.sc||"",fam:famOf(d),modelo:st.modelo,talla:st.talla,cendis:num(r.c),tiendas:num(r.t),oo:num(r.oo),w,weekly,cp:Math.max(1,num(r.cp)||1),cost:num(r.cost),tz:num(r.tz)}});
  const bySku={};items.forEach(i=>bySku[i.sku]=i);
  // pendiente por SKU desde pedidos del tracker
  const pendSku={};
  const cov0=+S.settings.cobertura||12;const hz=new Date();hz.setDate(hz.getDate()+cov0*7);const hzs=hz.getFullYear()+"-"+String(hz.getMonth()+1).padStart(2,"0")+"-"+String(hz.getDate()).padStart(2,"0");
  S.pedidos.forEach(p=>{const c=pcalc(p);if(c.status==="cancelado"||c.status==="completo")return;
    const pendHz=c.ents.length?c.ents.filter(e=>!e.fecha||e.fecha<=hzs).reduce((a,e)=>a+Math.max(0,num(e.cant)-num(e.recibida)),0):c.pend;
    const ratio=c.total?Math.min(1,pendHz/c.total):0;
    (p.lineas||[]).forEach(l=>{if(l.sku)pendSku[l.sku]=(pendSku[l.sku]||0)+num(l.cant)*ratio})});
  // demanda promedio por modelo (para tallas sin historial)
  const mod={};items.forEach(i=>{const m=mod[i.modelo]||(mod[i.modelo]={sum:0,n:0});if(i.weekly>0){m.sum+=i.weekly;m.n++}});
  const cov=+S.settings.cobertura||12;
  items.forEach(i=>{
    i.pendTracker=Math.round(pendSku[i.sku]||0);
    i.transito=Math.max(i.oo,i.pendTracker);
    let base="Consumo propio",dem=i.weekly;
    if(dem<=0){const m=mod[i.modelo];if(m&&m.n){dem=m.sum/m.n;base="Promedio del modelo"}else{base="Sin histórico"}}
    i.dem=dem;i.base=base;
    i.cobertura=dem>0?(i.cendis+i.transito)/dem:(i.cendis+i.transito>0?Infinity:0);
    let need=dem>0?Math.ceil(dem*cov)-i.cendis-i.transito:(i.cendis+i.transito>0?0:i.cp);
    if(dem<=0&&need>0)base="Mínimo 1 caja";
    i.base=base;
    i.sug=need>0?Math.ceil(need/i.cp)*i.cp:0;
    i.estado=i.cendis<=0?"zero":(dem>0&&i.cendis/dem<4?"low":"ok");
    i.prio=i.cendis>0?"":(i.transito>0?"Cubierto por pedido":(i.tiendas<=0?"Crítica":(i.weekly>0?"Alta":"Media")));
  });
  const famMap={};
  items.forEach(i=>{const f=famMap[i.fam]||(famMap[i.fam]={name:i.fam,items:[],cendis:0,tiendas:0,zero:0,low:0,ok:0,oo:0});
    f.items.push(i);f.cendis+=i.cendis;f.tiendas+=i.tiendas;f.oo+=i.oo;f[i.estado]++});
  S.pedidos.forEach(p=>{const f=famMap[p.familia];if(!f)return;const c=pcalc(p);f.ped=f.ped||[];f.ped.push(p);
    if(c.open){f.open=(f.open||0)+1;f.pend=(f.pend||0)+c.pend;if(c.next&&(!f.next||c.next.fecha<f.next))f.next=c.next.fecha}});
  const fams=Object.values(famMap).sort((a,b)=>b.zero-a.zero||a.name.localeCompare(b.name));
  D={items,bySku,fams,famMap};
}
function pcalc(p){
  const total=(p.lineas||[]).reduce((a,l)=>a+num(l.cant),0);
  const ents=(p.entregas||[]).slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const rec=ents.reduce((a,e)=>a+num(e.recibida),0);
  const plan=ents.reduce((a,e)=>a+num(e.cant),0);
  const t=todayStr();
  const lateE=ents.filter(e=>e.fecha&&e.fecha<t&&num(e.recibida)<num(e.cant));
  const next=ents.find(e=>num(e.recibida)<num(e.cant));
  let status;
  if(p.estado==="Cancelado")status="cancelado";
  else if(total>0&&rec>=total)status="completo";
  else if(p.estado==="Recibido")status="completo";
  else if(lateE.length)status="atrasado";
  else if(rec>0)status="parcial";
  else status="abierto";
  const open=status!=="cancelado"&&status!=="completo";
  return {total,rec,plan,pend:Math.max(0,total-rec),ents,late:lateE.length,next,status,open,sinPlan:total-plan};
}
const ST_CHIP={abierto:["info","En curso"],parcial:["warn","Parcial"],atrasado:["crit","Atrasado"],completo:["ok","Completo"],cancelado:["","Cancelado"]};
function stChip(p){const c=pcalc(p);const [k,l]=ST_CHIP[c.status];return '<span class="chip '+k+'">'+l+'</span>'}

function pedTable(ps){

/* ---------- Cronograma (Gantt) ---------- */
function vGantt(){
  const F=S.f.gantt;
  let ps=S.pedidos.filter(p=>(p.entregas||[]).length||p.fechaSolicitud);
  if(F.fam)ps=ps.filter(p=>p.familia===F.fam);
  if(!F.done)ps=ps.filter(p=>pcalc(p).open);
  let h='<div class="head"><div><div class="eyebrow">Cronograma</div><h1>Entregas programadas vs. pedido</h1><p>Cada barra va de la fecha de solicitud a la última entrega. El relleno es lo recibido; los rombos son entregas. Toca una fila para ver el detalle.</p></div></div>';
  h+='<div class="panel"><div class="panel-h"><div class="tools">'+sel("fGFam",[["","Todas las familias"]].concat(D.fams.map(f=>[f.name,f.name])),F.fam)+
    '<label class="chip" style="cursor:pointer"><input type="checkbox" id="fGDone"'+(F.done?' checked':'')+'> Incluir completos y cancelados</label></div>'+
    '<div class="legend"><span><i style="background:var(--surface);border:2px solid var(--brand)"></i>Programada</span><span><i style="background:#78BE20"></i>Recibida</span><span><i style="background:var(--crit-bg);border:2px solid var(--crit)"></i>Atrasada</span></div></div>';
  if(!ps.length){return h+'<div class="empty"><b>No hay pedidos con cronograma</b>Agrega entregas programadas a los pedidos para verlas aquí.</div></div>'}
  const t=todayStr();const dates=[t];
  ps.forEach(p=>{if(p.fechaSolicitud)dates.push(p.fechaSolicitud);(p.entregas||[]).forEach(e=>{if(e.fecha)dates.push(e.fecha);if(e.fechaReal)dates.push(e.fechaReal)})});
  dates.sort();let d0=pd(dates[0]),d1=pd(dates[dates.length-1]);
  d0=new Date(d0.getFullYear(),d0.getMonth(),1);d1=new Date(d1.getFullYear(),d1.getMonth()+1,1);
  const span=d1-d0;const X=s=>((pd(s)-d0)/span*100);
  const months=[];for(let d=new Date(d0);d<d1;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(new Date(d));
  const grid=months.map(m=>'<div class="g-grid" style="left:'+((m-d0)/span*100)+'%"></div>').join("");
  h+='<div class="tw"><div class="gantt"><div class="g-axis"><div class="g-lab"><b class="eyebrow">Pedido</b></div><div class="g-months">'+months.map(m=>'<span style="left:'+((m-d0)/span*100)+'%">'+MES[m.getMonth()]+' '+String(m.getFullYear()).slice(2)+'</span>').join("")+'<div class="g-today" style="left:'+X(t)+'%"></div></div></div>';
  ps.sort((a,b)=>a.familia.localeCompare(b.familia)||(a.fechaSolicitud||"").localeCompare(b.fechaSolicitud||""));
  ps.forEach(p=>{const c=pcalc(p);const st=p.fechaSolicitud||(c.ents[0]&&c.ents[0].fecha)||t;const en=c.ents.length?c.ents[c.ents.length-1].fecha||st:st;
    const l=X(st),w=Math.max(.8,X(en)-l);const pct=c.total?Math.min(100,c.rec/c.total*100):0;
    const cls=c.status==="completo"?"done":(c.late?"late":"");
    h+='<div class="g-row" data-ped="'+esc(p.id)+'" tabindex="0"><div class="g-lab"><b>'+esc(p.familia)+(p.tipo==="Pedido anual"?' · Anual':'')+' · '+esc(p.proveedor||"s/p")+'</b><span>'+esc(p.oc||"Sin Nº")+' · '+fmt0(c.rec)+' / '+fmt0(c.total)+' unid.</span></div><div class="g-track">'+grid+'<div class="g-today" style="left:'+X(t)+'%"></div><div class="g-bar '+cls+'" style="left:'+l+'%;width:'+w+'%"><i style="width:'+pct+'%"></i></div>'+
      c.ents.filter(e=>e.fecha).map(e=>{const r=num(e.recibida),q=num(e.cant);const k=r>=q&&q>0?"rec":(r>0?"part":(e.fecha<t?"late":""));return '<div class="g-dot '+k+'" style="left:'+X(e.fecha)+'%" title="'+fdate(e.fecha)+': '+fmt0(q)+' programadas, '+fmt0(r)+' recibidas"></div>'}).join("")+'</div></div>'});
  h+='</div></div></div>';
  return h;
}

function sparkline(log){
  if(log.length<2)return '';const v=log.slice(-20).map(e=>+e.ceros||0);const mx=Math.max(...v,1),W=120,H=28;

}

function parseCSV(text){
  const first=text.split(/\r?\n/,1)[0];const dl=[";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===dl){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
async function readFile(file){
  const buf=await file.arrayBuffer();let rows;
  if(/\.(csv|txt)$/i.test(file.name)){let text;try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){text=new TextDecoder("windows-1252").decode(buf)}rows=parseCSV(text)}
  else{if(typeof XLSX==="undefined")throw new Error("No se pudo cargar el lector de Excel. Guarda el archivo como CSV y súbelo de nuevo.");
    const wb=XLSX.read(buf,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""})}
  let hi=rows.findIndex(r=>r.some(c=>/^item$/i.test(String(c).trim()))&&r.some(c=>/descrip/i.test(String(c))));
  if(hi<0)hi=0;
  const hd=rows[hi].map(c=>String(c).trim());
  const find=(re,def)=>{const i=hd.findIndex(h=>re.test(h));return i>=0?i:def};
  const C={s:find(/^item$/i,0),d:find(/descripci/i,2),p:find(/nombre proveedor/i,4),sc:find(/nombre subclase/i,14),est:find(/^estado$/i,16),cp:find(/case pack/i,18),cost:find(/^costo proveedor primario/i,27),tz:find(/inventario\s*=\s*0/i,29),t:find(/^stock tiendas unidades/i,30),oo:find(/^on order/i,33),fecha:find(/fecha actualizaci/i,61)};
  const C35=34; // columna 35 indicada por el usuario
  const cClase=find(/^nombre clase$/i,-1),cDpto=find(/^nombre dpto$/i,-1);let otros=0;
  const w0=find(/cendis a las tiendas semana 0/i,53);
  let warn="";if(!/cendis/i.test(hd[C35]||""))warn="La columna 35 de este archivo es “"+(hd[C35]||"vacía")+"”. Se usó igual, revisa que el formato no haya cambiado.";
  const items=[];let exc=0,fecha="";
  for(const r of rows.slice(hi+1)){
    const d=String(r[C.d]==null?"":r[C.d]).replace(/\s+/g," ").trim();const s=String(r[C.s]==null?"":r[C.s]).trim();
    if(!s||!d)continue;
    // el stockstatus puede venir completo (todas las categorías): solo se toman los uniformes
    if(cClase>=0){if(!/UNIFORME/i.test(String(r[cClase]||""))){otros++;continue}}
    else if(cDpto>=0&&!/RRHH/i.test(String(r[cDpto]||""))){otros++;continue}
    if(d.startsWith("//")||/DESCONTINUADO/i.test(String(r[C.est]||""))){exc++;continue}
    let fv=r[C.fecha];if(typeof fv==="number"&&typeof XLSX!=="undefined"){const o=XLSX.SSF.parse_date_code(fv);fv=o?o.d+"/"+o.m+"/"+o.y:fv}
    if(!fecha&&fv)fecha=String(fv);
    items.push({s,d,p:String(r[C.p]||"").trim(),sc:String(r[C.sc]||"").trim(),c:num(r[C35]),t:num(r[C.t]),oo:num(r[C.oo]),w:[0,1,2,3,4].map(k=>num(r[w0+k])),cp:num(r[C.cp])||1,cost:num(r[C.cost]),tz:num(r[C.tz])});
  }
  if(!items.length)throw new Error((otros?"El archivo tiene "+otros.toLocaleString("es-VE")+" artículos, pero ninguno de la clase UNIFORMES. ":"")+"No se encontraron SKUs de uniformes en el archivo. Verifica que sea el stockstatus con la fila de encabezados (Item, Descripción Artículo…).");
  const prev={};(S.stock||[]).forEach(i=>prev[i.s]=i);const now={};items.forEach(i=>now[i.s]=i);
  const diff=S.stock?{newZero:items.filter(i=>i.c<=0&&prev[i.s]&&prev[i.s].c>0),outZero:items.filter(i=>i.c>0&&prev[i.s]&&prev[i.s].c<=0),nuevos:items.filter(i=>!prev[i.s]),fuera:S.stock.filter(i=>!now[i.s])}:null;
  return {archivo:file.name,items,otros,filtro:cClase>=0?"Nombre Clase = UNIFORMES":(cDpto>=0?"Nombre Dpto = RRHH":""),excluidos:exc,ceros:items.filter(i=>i.c<=0).length,fechaStock:fecha,col35:hd[C35],warn,diff};
}
async function confirmUpload(){
  const P=S.preview;if(!P||P.error)return;
  const meta={fechaStock:P.fechaStock,archivo:P.archivo,cargado:new Date().toISOString(),por:S.email||"",total:P.items.length,excluidos:P.excluidos,ceros:P.ceros};
  if(!HAS_GAS){S.stock=P.items;S.meta=meta;S.log=(S.log||[]).concat([{cargado:meta.cargado,fechaStock:meta.fechaStock,archivo:meta.archivo,total:meta.total,ceros:meta.ceros,por:meta.por}]).slice(-200);S.preview=null;persist();toast(GH.token?"Stock actualizado. Publicando para todos…":"Stock actualizado");render();return}
  S.saving=true;render();
  try{await api("guardarStock",P.items,meta,TOKEN);S.preview=null;toast("Stockstatus actualizado para todos");S.saving=false;await refresh(true);return}
  catch(e){toast(errMsg(e))}
  S.saving=false;render();
}

function cumChart(p,c){
  const t=todayStr();const pts=c.ents.filter(e=>e.fecha);if(!pts.length)return "";
  const all=[p.fechaSolicitud||pts[0].fecha,t].concat(pts.map(e=>e.fecha),pts.map(e=>e.fechaReal).filter(Boolean)).sort();
  const a=pd(all[0]),b=pd(all[all.length-1]);const span=Math.max(864e5,b-a);
  const W=640,H=200,L=44,R=12,T=14,B=28;const mx=Math.max(c.total,c.plan,c.rec,1);
  const X=s=>L+((pd(s)-a)/span)*(W-L-R),Y=v=>T+(1-v/mx)*(H-T-B);
  let acc=0,dp="M"+X(all[0])+","+Y(0);pts.forEach(e=>{dp+=" H"+X(e.fecha);acc+=num(e.cant);dp+=" V"+Y(acc)});dp+=" H"+(W-R);
  const rec=pts.filter(e=>num(e.recibida)>0).map(e=>({f:e.fechaReal||e.fecha,v:num(e.recibida)})).sort((x,y)=>x.f.localeCompare(y.f));
  let ar=0,rp="M"+X(all[0])+","+Y(0);rec.forEach(e=>{rp+=" H"+X(e.f);ar+=e.v;rp+=" V"+Y(ar)});rp+=" H"+Math.min(X(t),W-R);
  const ticks=[0,.5,1].map(k=>Math.round(mx*k));
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Acumulado programado vs recibido">'+
    ticks.map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmt0(v)+'</text>').join("")+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(c.total)+'" y2="'+Y(c.total)+'" stroke="var(--navy-2)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="'+(W-R)+'" y="'+(Y(c.total)-5)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">Pedido '+fmt0(c.total)+'</text>'+
    '<path d="'+dp+'" fill="none" stroke="var(--brand)" stroke-width="2.5"/>'+
    '<path d="'+rp+'" fill="none" stroke="#78BE20" stroke-width="3"/>'+
    (X(t)<=W-R?'<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#FF6C0C" stroke-width="1.5"/><text x="'+(X(t)+4)+'" y="'+(H-B-4)+'" font-size="10" font-weight="700" fill="var(--warn)">Hoy</text>':'')+
    '<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+fdate(all[0])+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fdate(all[all.length-1])+'</text>'+
    '</svg>';
}

async function savePed(){
  const p=readForm();
  p.lineas=p.lineas.filter(l=>(l.sku||l.desc)&&num(l.cant)>0);
  p.lineas.forEach(l=>{const i=D.bySku[l.sku];if(i)l.desc=i.desc});
  if(!p.lineas.length){toast("Agrega al menos una línea con SKU y cantidad");reForm();return}
  if(!p.solicitante||(!p.unidad&&p.tipo!=="Pedido anual")){toast("Indica el solicitante y la unidad de RRHH");reForm();return}
  const doc=JSON.parse(JSON.stringify(p));doc.updatedAt=new Date().toISOString();doc.updatedBy=S.email||"";if(!doc.createdAt)doc.createdAt=doc.updatedAt;
  if(!HAS_GAS){const k=S.pedidos.findIndex(x=>x.id===p.id);k>=0?S.pedidos[k]=doc:S.pedidos.push(doc);S.drawer={type:"ped",id:p.id};persist();render();toast("Pedido guardado");return}
  const b=$("#pSave");if(b){b.disabled=true;b.textContent="Guardando…"}
  try{await api("guardarPedido",doc,TOKEN);S.drawer={type:"ped",id:p.id};toast("Pedido guardado")}
  catch(e){toast(errMsg(e));if(b){b.disabled=false;b.textContent="Guardar pedido"}return}

async function saveRec(id,eid){

const PED_COLS=[["oc","N° Pedido"],["tipo","Tipo"],["familia","Familia"],["proveedor","Proveedor"],["solicitante","Solicitante"],["unidad","Unidad RRHH"],["destino","Destino"],["fechaSol","Fecha solicitud"],["estado","Estado"],["sku","SKU"],["desc","Descripción"],["cant","Cantidad"],["fechaEnt","Fecha entrega"],["cantEnt","Cantidad entrega"],["rec","Cantidad recibida"],["fechaReal","Fecha recepción"],["notas","Notas"]];
function pedColOf(h){h=String(h||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");if(!h)return null;
  if(/recibid/.test(h))return "rec";if(/cant.*entreg|entreg.*cant/.test(h))return "cantEnt";if(/^cant/.test(h)||/^unidades (pedidas|solicitadas)/.test(h))return "cant";
  if(/fecha.*(solicitud|requerimiento|pedido)/.test(h))return "fechaSol";if(/fecha.*(entrega|llegada|programad|compromiso)/.test(h))return "fechaEnt";if(/fecha.*(real|recepcion|recibid)/.test(h))return "fechaReal";
  if(/^(n[°ºo.]*\s*)?(de\s*)?(pedido|oc|orden( de compra)?|requerimiento)$|^n[°ºo.]* ?(pedido|oc)/.test(h))return "oc";
  if(/^tipo/.test(h))return "tipo";if(/^familia/.test(h))return "familia";if(/^proveedor|^nombre proveedor/.test(h))return "proveedor";if(/^solicitante/.test(h))return "solicitante";
  if(/unidad/.test(h))return "unidad";if(/^destino/.test(h))return "destino";if(/^(estado|estatus|status)/.test(h))return "estado";
  if(/^(sku|item|codigo)/.test(h))return "sku";if(/^(descripcion|prenda|articulo)/.test(h))return "desc";if(/^(nota|observacion|comentario)/.test(h))return "notas";return null}
function dIso(v){if(v==null||v==="")return "";if(v instanceof Date&&!isNaN(v))return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
  const t=String(v);let m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}return ""}
function mapEstado(t){t=String(t||"").toLowerCase();if(!t)return "";if(/entregad|recibid/.test(t))return "Recibido";if(/cancel/.test(t))return "Cancelado";if(/transit/.test(t))return "En tránsito";if(/produc|tela|confecc/.test(t))return "En producción";if(/aprob/.test(t))return "Aprobado";return "Solicitado"}
async function readRows(file,dates){const buf=await file.arrayBuffer();
  if(/\.(csv|txt)$/i.test(file.name)){let text;try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){text=new TextDecoder("windows-1252").decode(buf)}return parseCSV(text)}
  if(typeof XLSX==="undefined")throw new Error("No se pudo cargar el lector de Excel. Revisa tu conexión a internet o guarda el archivo como CSV.");
  const wb=XLSX.read(buf,{type:"array",cellDates:!!dates});let best=null;
  for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});const hi=rows.slice(0,15).findIndex(r=>r.filter(c=>pedColOf(c)).length>=3);if(hi>=0&&rows.slice(0,15)[hi].some(c=>pedColOf(c)==="cant")){const ref=wb.Sheets[n]["!ref"];best={rows,hi,sheet:n,r0:ref?XLSX.utils.decode_range(ref).s.r:0};break}}
  if(!best)throw new Error("No encontré una hoja con columnas de pedidos (por ejemplo SKU, Descripción, Cantidad). Usa la plantilla.");
  return best}
async function readPedFile(file){
  let R=await readRows(file,false);let rows,hi,r0=0;if(Array.isArray(R)){rows=R;hi=rows.slice(0,15).findIndex(r=>r.filter(c=>pedColOf(c)).length>=3);if(hi<0)throw new Error("No encontré los encabezados de pedidos. Usa la plantilla.")}else{rows=R.rows;hi=R.hi;r0=R.r0||0}
  const head=rows[hi].map(pedColOf);const idx={};head.forEach((k,i)=>{if(k&&idx[k]==null)idx[k]=i});
  const byDesc={};D.items.forEach(i=>byDesc[i.desc.toUpperCase()]=i);
  const groups={},order=[];let skipped=0,ejemplo=0,sinSku=0,lineasN=0;const errores=[];
  rows.slice(hi+1).forEach((r,k)=>{const g=c=>idx[c]==null?"":r[idx[c]];const fila=r0+hi+k+2;
    if(!r.some(x=>String(x).trim()!==""))return;
    const oc=String(g("oc")||"").trim();if(/^ejemplo/i.test(oc)){ejemplo++;return}
    const cant=num(g("cant"));if(!(cant>0)){skipped++;if(errores.length<8)errores.push("Fila "+fila+": sin cantidad");return}
    let skuV=g("sku");let sku=typeof skuV==="number"?String(Math.round(skuV)):String(skuV||"").trim().replace(/\.0+$/,"");if(!/^\d{5,}$/.test(sku))sku="";
    let desc=String(g("desc")||"").replace(/\s+/g," ").trim();let it=sku?D.bySku[sku]:null;
    if(!it&&desc){it=byDesc[desc.toUpperCase()]||null;if(it)sku=it.sku}
    if(it)desc=it.desc;if(!sku)sinSku++;if(!sku&&!desc){skipped++;if(errores.length<8)errores.push("Fila "+fila+": sin SKU ni descripción");return}
    const familia=String(g("familia")||"").trim()||(it?it.fam:famOf(desc.toUpperCase()));
    const estadoRaw=String(g("estado")||"").trim();const estado=mapEstado(estadoRaw);
    const fechaSol=dIso(g("fechaSol")),fechaEnt=dIso(g("fechaEnt")),fechaReal=dIso(g("fechaReal"));
    const unidad=String(g("unidad")||"").trim().replace(/^rrhh\s+/i,"").replace(/^operaciones$/i,"Operaciones");
    const proveedor=String(g("proveedor")||"").trim();
    const key=oc?"oc:"+oc.toLowerCase():["k",unidad,fechaSol,proveedor,familia,estado,fechaEnt].join("|").toLowerCase();
    let G=groups[key];if(!G){G=groups[key]={key,oc,tipo:String(g("tipo")||"").trim(),familia,proveedor,solicitante:String(g("solicitante")||"").trim(),unidad,destino:String(g("destino")||"").trim(),fechaSol,estado,estados:[],notas:[],lines:{},ents:{}};order.push(key)}
    if(estado)G.estados.push(estado);const nt=String(g("notas")||"").trim();if(nt&&G.notas.indexOf(nt)<0)G.notas.push(nt);if(estadoRaw&&!/^(entregado|en produccion|en producción|solicitado|aprobado|recibido)$/i.test(estadoRaw)&&G.notas.indexOf(estadoRaw)<0)G.notas.push(estadoRaw);
    const lk=sku||("d:"+desc);const L=G.lines[lk]||(G.lines[lk]={sku,desc,cant:0,maxc:0,hasEnt:false});const ce=num(g("cantEnt"));
    if(ce>0){L.hasEnt=true;L.maxc=Math.max(L.maxc,cant)}else L.cant+=cant;
    const qEnt=ce>0?ce:cant;let rec=num(g("rec"));if(!(rec>0)&&estado==="Recibido")rec=qEnt;
    const ef=fechaEnt||(rec>0?(fechaReal||fechaSol):"");const ek=ef||"sin-fecha";const E=G.ents[ek]||(G.ents[ek]={fecha:ef,cant:0,recibida:0,fechaReal:"",nota:""});E.cant+=qEnt;E.recibida+=Math.min(rec,qEnt);if(fechaReal&&!E.fechaReal)E.fechaReal=fechaReal;if(rec>0&&!E.fechaReal&&!fechaEnt)E.nota="Sin fecha de llegada registrada";
    lineasN++});
  const peds=order.map(k=>{const G=groups[k];const lineas=Object.values(G.lines).map(L=>({sku:L.sku,desc:L.desc,cant:L.hasEnt?Math.max(L.maxc,L.cant):L.cant}));
    const ents=Object.values(G.ents).filter(e=>e.fecha||e.recibida>0).map((e,i)=>({id:"e"+(i+1),fecha:e.fecha,cant:e.cant,recibida:e.recibida,fechaReal:e.recibida>0?(e.fechaReal||e.fecha):"",nota:e.nota}));
    const tot=lineas.reduce((a,l)=>a+l.cant,0),rec=ents.reduce((a,e)=>a+e.recibida,0);
    const est=G.estados.length?(G.estados.every(x=>x==="Recibido")?"Recibido":G.estados.filter(x=>x!=="Recibido")[0]||G.estados[0]):(rec>=tot&&tot>0?"Recibido":"Solicitado");
    const id=G.oc?"oc-"+G.oc.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60):"imp-"+sha256(G.key).slice(0,14);
    const fs=G.fechaSol;const unidad=G.unidad;
    return {id,oc:G.oc||("REQ "+(fs?fdate(fs):"s/f")+(unidad?" · "+unidad:"")),tipo:/anual/i.test(G.tipo)?"Pedido anual":"Requerimiento",familia:G.familia,proveedor:G.proveedor,solicitante:G.solicitante||(unidad?"RRHH "+unidad:""),unidad,destino:G.destino||"Tiendas",fechaSolicitud:fs,estado:est,notas:G.notas.join("\n"),lineas,entregas:ents,fuente:"Carga masiva: "+file.name}});
  if(!peds.length)throw new Error("No encontré pedidos válidos en el archivo"+(skipped?" ("+skipped+" filas sin cantidad o sin SKU)":"")+".");
  const sig=p=>[String(p.unidad||"").toLowerCase(),p.fechaSolicitud||"",p.familia,(p.lineas||[]).map(l=>l.sku||l.desc).sort().join(",")].join("|");
  const exist={};S.pedidos.forEach(p=>{exist[p.id]=p;if(p.oc)exist["oc:"+p.oc.toLowerCase()]=p;exist["sig:"+sig(p)]=p});
  let nuevos=0,act=0;peds.forEach(p=>{const o=exist[p.id]||exist["oc:"+String(p.oc).toLowerCase()]||exist["sig:"+sig(p)];if(o){p.id=o.id;p.createdAt=o.createdAt;act++}else nuevos++});
  return {archivo:file.name,hoja:Array.isArray(R)?"":R.sheet,peds,nuevos,act,skipped,ejemplo,sinSku,lineasN,errores,mode:"merge",unidades:peds.reduce((a,p)=>a+p.lineas.reduce((b,l)=>b+l.cant,0),0)}}
function pedPreviewHTML(){const P=S.pedPrev;if(!P)return "";if(P.error)return '<div class="banner warn">'+esc(P.error)+' <button class="btn sm" data-act="cancelPed">Cerrar</button></div>';
  return '<section class="panel"><div class="panel-h"><h3>Vista previa de pedidos: '+esc(P.archivo)+(P.hoja?' · hoja '+esc(P.hoja):'')+'</h3><div class="tools"><select class="inp" id="pedMode"><option value="merge"'+(P.mode==="merge"?" selected":"")+'>Agregar y actualizar (mismo N° de pedido se reemplaza)</option><option value="replace"'+(P.mode==="replace"?" selected":"")+'>Reemplazar todos los pedidos</option></select><button class="btn" data-act="cancelPed">Descartar</button><button class="btn pri" data-act="confirmPed">Confirmar carga</button></div></div><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">'+
  '<div class="stats"><div class="stat"><div class="l">Pedidos en el archivo</div><div class="v">'+P.peds.length+'</div></div><div class="stat"><div class="l">Nuevos</div><div class="v" style="color:var(--ok)">'+P.nuevos+'</div></div><div class="stat"><div class="l">Se actualizan</div><div class="v">'+P.act+'</div></div><div class="stat"><div class="l">Unidades</div><div class="v">'+fmt0(P.unidades)+'</div></div></div>'+
  (P.mode==="replace"?'<div class="banner warn">Se eliminarán los '+S.pedidos.length+' pedidos actuales y quedarán solo los '+P.peds.length+' de este archivo.</div>':'')+
  '<div class="kv"><div><span>Filas leídas</span><b>'+P.lineasN+'</b></div><div><span>Líneas sin SKU</span><b>'+P.sinSku+'</b></div><div><span>Filas omitidas</span><b>'+P.skipped+'</b></div>'+(P.ejemplo?'<div><span>Filas de ejemplo ignoradas</span><b>'+P.ejemplo+'</b></div>':'')+'</div>'+
  (P.errores.length?'<div class="foot">'+P.errores.map(esc).join(" · ")+'</div>':'')+
  '</div><div class="tw" style="max-height:340px"><table><thead><tr><th>Pedido</th><th>Familia</th><th>Unidad</th><th>Proveedor</th><th>Estado</th><th class="n">Líneas</th><th class="n">Unidades</th><th class="n">Recibido</th><th>Entregas</th></tr></thead><tbody>'+
  P.peds.map(p=>'<tr><td><b>'+esc(p.oc)+'</b></td><td>'+esc(p.familia)+'</td><td>'+esc(p.unidad||"—")+'</td><td>'+esc(p.proveedor||"—")+'</td><td>'+esc(p.estado)+'</td><td class="n">'+p.lineas.length+'</td><td class="n">'+fmt0(p.lineas.reduce((a,l)=>a+l.cant,0))+'</td><td class="n">'+fmt0(p.entregas.reduce((a,e)=>a+e.recibida,0))+'</td><td>'+(p.entregas.map(e=>fdate(e.fecha)).join(", ")||"—")+'</td></tr>').join("")+'</tbody></table></div></section>'}
function applyPedImport(){const P=S.pedPrev;if(!P||P.error)return;const now=new Date().toISOString();
  if(P.mode==="replace"){S.eliminados=(S.eliminados||[]).concat(S.pedidos.map(p=>({id:p.id,at:now})));S.pedidos=[]}
  const ids=new Set(P.peds.map(p=>p.id));S.pedidos=S.pedidos.filter(p=>!ids.has(p.id));
  P.peds.forEach(p=>{p.updatedAt=now;p.updatedBy=S.email||"";if(!p.createdAt)p.createdAt=now;S.pedidos.push(p)});
  S.eliminados=(S.eliminados||[]).filter(x=>!ids.has(x.id));
  const n=P.peds.length;S.pedPrev=null;persist();render();toast(n+" pedidos cargados"+(GH.token?". Publicando…":""))}

  const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=PED_COLS.map(c=>({wch:Math.max(12,c[1].length+2)}));
  const ins=XLSX.utils.aoa_to_sheet([["Cómo llenar la plantilla"],["Una fila por SKU. Las filas con el mismo N° de pedido forman un solo pedido."],["Si un SKU llega en varias entregas, repite la fila con la misma Cantidad y pon en Cantidad entrega lo de cada entrega con su Fecha entrega."],["Estado: Solicitado, Aprobado, En producción, En tránsito, Recibido o Cancelado. Entregado cuenta como Recibido."],["Si el estado es Recibido y no pones Cantidad recibida, se toma todo como recibido."],["Unidad RRHH: "+(S.settings.unidades||[]).join(", ")],["Familia es opcional: si el SKU existe en el stockstatus se toma de ahí."],["Fechas en formato dd/mm/aaaa."],["Las filas cuyo N° de pedido empieza por EJEMPLO se ignoran."],["También se acepta el formato de la hoja Estatus Semanal (Unidad de Recursos Humanos que Solicita, Fecha del requerimiento, SKU, Prenda, Cantidad Solicitada, Proveedor, Estatus, Fecha de llegada)."]]);
  ins["!cols"]=[{wch:120}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Pedidos");XLSX.utils.book_append_sheet(wb,ins,"Instrucciones");XLSX.writeFile(wb,"Plantilla_pedidos_uniformes.xlsx")}
